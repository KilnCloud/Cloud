[versions]
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
findsecbugs = "1.14.0"
grpc = "1.85.0"
jackson = "2.22.3"
jacoco = "0.8.15"
jimfs = "1.3.2"
jspecify = "1.0.1"
junit = "5.14.3"
nullaway = "0.14.2"
palantir-java-format = "2.102.0"
protobuf = "4.36.2"
protobuf-plugin = "0.10.0"
spotbugs-plugin = "6.5.13"
spotless-plugin = "8.10.4"

[libraries]
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
# Gradle plugin artifacts applied by the build-logic convention plugins.
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-plugin" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-plugin" }

